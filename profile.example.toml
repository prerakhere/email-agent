# Your taste, kept out of the code. Copy this file to `profile.toml` (gitignored) and edit it.
# Everything is optional: with no profile.toml the agent uses neutral defaults.

# Times in the digest, and "same day" matching of payments, use this zone (an IANA name).
timezone = "Europe/London"

# What you care about, one short line each (at most 20 lines, 300 characters each).
# These are added to the instructions the classifier follows.
# Without any, the agent uses neutral defaults (for example, delivery updates are notifications).
preferences = [
  "Delivery and shipping updates matter to me: treat them as important, not notifications.",
  "I run a small shop: order confirmations from customers are important, not receipts.",
  "Webinar invitations from lists I follow are newsletters, not notifications.",
]

# Currency code -> symbol. Add the ones you use; others are shown by their code.
[currency_symbols]
CHF = "Fr"

# Your own Gmail folders the agent may learn sender rules from, and may trust as YOUR filing when
# mail already sits there: folder -> category. A folder covers everything nested under it.
# Categories: bills, receipts, transactions, statements, newsletters, promotions,
# important, notifications, job_alerts, needs_review. The Agent/... labels are not allowed here.
[learn_from_folders]
"Reading list" = "newsletters"
"Money/Receipts" = "receipts"

# Your existing labels to file each category into, in order of preference.
# Anything not listed here is filed under an Agent/... label.
# Trade-off: a folder that is ALSO listed above is trusted as your own filing even when the agent
# put the mail there, so the agent's guesses in it are never re-checked. Keep the two lists apart
# unless you review that folder yourself.
[file_into]
bills = ["Money/Bills"]
promotions = ["Shopping/Offers"]
