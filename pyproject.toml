[project]
name = "gmail-agent"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "azure-functions>=1.26.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "langchain>=1.4.8",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "langsmith>=0.14.17",
    "pydantic>=2.14.2",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "mcp>=2.3.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
